<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>斑马鱼毒理图谱 · Danio rerio Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6E6B'/%3E%3Cpath d='M6 17c4-6 9-7.5 14-4.5 1.6 1 2.8 2.5 3.6 4.5-.8 2-2 3.5-3.6 4.5-5 3-10 1.5-14-4.5Z' fill='%23E6F1EF'/%3E%3Cpath d='M24 17l4-4v8z' fill='%23E6F1EF'/%3E%3C/svg%3E">
<style>
/* ── tokens ─────────────────────────────────────────────────────────── */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#1B2421; --ink2:#33403B; --muted:#5B6661;
  --line:#E2E4DF; --line2:#D5D9D3; --teal:#0B6E6B; --teal-d:#08504E; --teal-bg:#E6F1EF;
  --dark:#0E2226; --dark2:#17302F; --dline:#2E4A4F; --dink:#E6EEEC; --dmuted:#9FB3AF;
  --amber:#B97A18; --amber-bg:#FBF3E2; --gold:#D9C58E;
  --nav-w:248px; --aside-w:404px; --r:12px;
  --shadow:0 8px 24px rgba(27,36,33,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--teal);text-decoration:none}
a:hover{color:var(--teal-d);text-decoration:underline}
svg{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C9CEC6;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B1A7;background-clip:content-box}
::selection{background:#CFE6E2}

/* ── shell ──────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header.top{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding:10px 18px;background:var(--surface);
  border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-width:0}
.brand .logo{width:31px;height:31px;flex:0 0 31px;border-radius:8px}
.brand .nm{font-size:15px;font-weight:750;letter-spacing:.01em;line-height:1.25;white-space:nowrap}
.brand .sb{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap}
.searchwrap{flex:1 1 300px;max-width:540px;position:relative;min-width:150px}
.searchbox{display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;background:var(--bg);
  border:1px solid var(--line2);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(11,110,107,.1)}
.searchbox .sic{color:var(--muted);flex:0 0 16px}
.searchbox input{flex:1;min-width:0;height:36px;border:0;background:transparent;outline:0;font:inherit;font-size:13.5px;color:var(--ink)}
.searchbox input::placeholder{color:#8B948E}
.kbd{flex:0 0 auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--muted);
  border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:#fff;line-height:1.5}
.hd-stats{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hd-stats b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.hd-stats .lbl{color:var(--muted)}
.hd-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink2);
  font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--teal);color:var(--teal-d)}
.btn.ghost{background:transparent}

/* ── global search results ──────────────────────────────────────────── */
.results{position:absolute;top:44px;left:0;right:0;z-index:60;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 40px rgba(27,36,33,.16);max-height:min(62vh,480px);overflow:auto;display:none}
.results.on{display:block}
.rgroup{padding:5px 0;border-bottom:1px solid var(--line)}
.rgroup:last-child{border-bottom:0}
.rgroup h4{margin:0;padding:7px 14px 4px;font-size:10.5px;font-weight:650;color:var(--muted);letter-spacing:.08em;display:flex;justify-content:space-between}
.rgroup h4 em{font-style:normal;font-weight:400;letter-spacing:0}
.ritem{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:7px 14px;font-size:13px;line-height:1.45;color:var(--ink2)}
.ritem:hover,.ritem.sel{background:var(--teal-bg)}
.ritem b{font-weight:650;color:var(--ink);min-width:0;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem span{color:var(--muted);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem span:not(.go){flex:0 1 auto}
.ritem .go{margin-left:auto;color:var(--muted);font-size:11px}
.results mark{background:#FFEEB0;color:inherit;border-radius:2px;padding:0 1px}
.rfoot{padding:8px 14px;font-size:11.5px;color:var(--muted);background:#FAFBF9}

/* ── body columns ───────────────────────────────────────────────────── */
.body{flex:1 1 auto;display:flex;min-height:0;position:relative}
nav.side{flex:0 0 var(--nav-w);width:var(--nav-w);background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;transition:width .18s ease,flex-basis .18s ease}
nav.side.collapsed{flex-basis:60px;width:60px}
nav.side.collapsed .navscroll{padding:4px 6px}
nav.side.collapsed .navtop{justify-content:center}
nav.side.collapsed .nitem{justify-content:center;padding:9px 0;gap:0}
nav.side.collapsed .nitem .nm,nav.side.collapsed .nitem .cnt,nav.side.collapsed .nitem .chev,
nav.side.collapsed .navsec,nav.side.collapsed .nsub,nav.side.collapsed .navfoot,
nav.side.collapsed .navtoggle-label{display:none!important}
nav.side.collapsed .nitem .ic{width:19px;height:19px;flex:0 0 19px}
nav.side.collapsed .nitem .dot{display:none}
.navtop{display:flex;justify-content:flex-end;gap:6px;padding:8px 8px 0;flex:0 0 auto}
.icbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);
  display:inline-grid;place-items:center;flex:0 0 auto;transition:border-color .15s,color .15s}
.icbtn:hover{border-color:var(--teal);color:var(--teal-d)}
.navscroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 10px 12px;overscroll-behavior:contain}
.navsec{margin:13px 6px 4px;font-size:10.5px;font-weight:650;letter-spacing:.09em;color:#8B948E}
.nitem{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;
  font-size:13px;line-height:1.4;color:var(--ink2);transition:background .12s,color .12s}
.nitem:hover{background:#F0F2EE;color:var(--ink)}
.nitem.on{background:var(--teal-bg);color:var(--teal-d);font-weight:650}
.nitem .ic{width:17px;height:17px;flex:0 0 17px;color:#7C8781;display:grid;place-items:center}
.nitem.on .ic{color:var(--teal)}
.nitem .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .cnt{flex:0 0 auto;min-width:22px;text-align:center;font-size:10.5px;font-variant-numeric:tabular-nums;
  color:var(--muted);background:#EEF0EC;border-radius:999px;padding:1px 6px}
.nitem.on .cnt{background:#fff;color:var(--teal-d)}
.nitem .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.nitem .chev{color:#98A19B;display:grid;place-items:center;transition:transform .15s;flex:0 0 10px}
.nitem[aria-expanded="true"] .chev{transform:rotate(90deg)}
.nsub{margin:1px 0 2px 14px;padding-left:8px;border-left:1px solid var(--line);display:none}
.nsub.on{display:block}
.nsub .nitem{font-size:12.5px;padding:5px 8px}
.ncat{padding:7px 8px 2px;font-size:10px;color:#98A19B;letter-spacing:.06em}
.navfoot{flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.navfoot b{color:var(--ink2);font-weight:650;font-variant-numeric:tabular-nums}
.navfoot .mini{display:flex;justify-content:space-between;gap:8px}

/* ── center ─────────────────────────────────────────────────────────── */
main.center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.crumb{display:flex;align-items:center;gap:12px;flex:0 0 auto;padding:12px 16px 8px}
.crumb .t{display:flex;align-items:baseline;gap:9px;min-width:0}
.crumb h1{margin:0;font-size:18px;font-weight:750;letter-spacing:.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .en{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch}
.crumb .path{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.crumb .path i{font-style:normal;color:#B3BBB5}
.stagewrap{flex:1 1 auto;min-height:0;display:flex;padding:0 16px}
section.stage{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:var(--dark);border:1px solid #17343A;border-radius:14px;box-shadow:0 14px 34px rgba(14,34,38,.14)}
section.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(120% 80% at 50% 0%,rgba(59,140,130,.18),transparent 60%),
             radial-gradient(90% 70% at 80% 100%,rgba(79,151,174,.10),transparent 65%)}
.stagebar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 11px;border-bottom:1px solid #22393D;flex:0 0 auto}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--dline);border-radius:9px;background:rgba(255,255,255,.04)}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:11.5px;color:var(--dink);opacity:.78;transition:background .13s,color .13s}
.seg button:hover{opacity:1;background:rgba(255,255,255,.06)}
.seg button.on{background:#1F4441;color:#fff;opacity:1;box-shadow:inset 0 0 0 1px #4F7F7A}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.tbtn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--dline);background:var(--dark2);
  color:var(--dink);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;transition:border-color .13s,background .13s}
.tbtn:hover{border-color:#4F7F7A}
.tbtn.on{border-color:#4F7F7A;background:#1F4441;color:#fff}
.tbtn .sw{width:7px;height:7px;border-radius:50%;background:#6E8B87}
.tbtn.on .sw{background:#5ED3C4;box-shadow:0 0 8px rgba(94,211,196,.6)}
section.stage .hint{font-size:11px;color:var(--dmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#anatomyHost{position:relative;z-index:1;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden}
#anatomyHost > svg{display:block;width:100%;height:100%}
.stageload{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:26px;text-align:center;color:var(--dink)}
.stageload .fishghost{width:104px;height:104px;opacity:.4}
.stageload b{font-size:14px;color:#fff;font-weight:650}
.stageload p{margin:0;max-width:34em;font-size:12px;line-height:1.75;color:var(--dmuted)}
.stageload .mono{font-size:10.5px;color:#8FA9A4;background:rgba(255,255,255,.05);border:1px solid var(--dline);
  padding:3px 8px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stageload .tbtn{margin-top:2px}
.hoverhint{position:absolute;left:12px;bottom:10px;z-index:4;font-size:11.5px;color:var(--dmuted);pointer-events:none;
  background:rgba(14,34,38,.58);padding:2px 8px;border-radius:6px;opacity:0;transition:opacity .13s}
.hoverhint.on{opacity:1}
.stagenote{position:absolute;right:11px;bottom:9px;z-index:4;font-size:10.5px;color:#7E9995;pointer-events:none;letter-spacing:.02em}

/* timeline */
.timeline{flex:0 0 auto;margin:10px 16px 14px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px 10px;box-shadow:0 2px 8px rgba(27,36,33,.03)}
.tlhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.tlhead .tt{font-size:11.5px;font-weight:650;color:var(--ink2);letter-spacing:.02em}
.tlhead .tm{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tlgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.tl{min-width:0;min-height:39px;padding:4px 3px;border:1px solid var(--line);border-radius:8px;background:#FCFDFB;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .12s,border-color .12s,color .12s}
.tl .tn{font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ink2)}
.tl small{font-size:9.5px;line-height:1.2;color:#8B948E;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl:hover{border-color:var(--teal);background:var(--teal-bg)}
.tl.on{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 8px rgba(11,110,107,.22)}
.tl.on .tn{color:#fff;font-weight:650}
.tl.on small{color:#BFE3DF}
.tldesc{margin-top:8px;font-size:12px;line-height:1.68;color:var(--ink2);min-height:2.8em}
.tldesc b{color:var(--teal-d);font-weight:650}
.tldesc .tph{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;margin-right:4px}
.tldesc.idle{color:var(--muted)}

/* ── right detail ───────────────────────────────────────────────────── */
aside.detail{flex:0 0 var(--aside-w);width:var(--aside-w);background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;min-width:0;transition:width .18s ease,flex-basis .18s ease}
aside.detail.wide{flex-basis:504px;width:504px}
aside.detail.reading{flex-basis:568px;width:568px}
aside.detail.collapsed{flex-basis:52px;width:52px}
aside.detail.collapsed .dscroll,aside.detail.collapsed .dhead h2,aside.detail.collapsed .dhead .dk{display:none}
aside.detail.collapsed .dhead{flex-direction:column;align-items:center;padding-top:10px}
aside.detail.collapsed #detailClose svg{transform:rotate(180deg)}
aside.detail.collapsed .railt{display:block}
.railt{display:none;writing-mode:vertical-rl;font-size:11px;letter-spacing:.22em;color:var(--muted);margin-top:12px;cursor:pointer;user-select:none}
.railt:hover{color:var(--teal)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex:0 0 auto;
  padding:11px 13px 8px;border-bottom:1px solid var(--line)}
.dhead .dk{font-size:10.5px;font-weight:650;letter-spacing:.09em;color:var(--teal);line-height:1.5}
.dhead h2{margin:1px 0 0;font-size:15.5px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dscroll{flex:1 1 auto;overflow-y:auto;padding:0 13px 24px;overscroll-behavior:contain}
.dhero{padding:12px 2px 2px;display:flex;gap:9px;align-items:flex-start}
.dhero .dot{width:11px;height:11px;border-radius:4px;margin-top:6px;flex:0 0 11px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dhero .h{min-width:0}
.dhero .sub{font-size:11.5px;color:var(--muted);line-height:1.5}
.dhero .name{font-size:16px;font-weight:700;line-height:1.35}
.dhero .kind{font-size:10.5px;color:var(--teal);letter-spacing:.06em;font-weight:650}
.card{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:9px 0 0;background:#fff}
.card.flat{background:#FAFBF9;border-color:#E9EBE6}
.card p.lead{margin:0;font-size:12.8px;line-height:1.82;color:var(--ink2)}
.card h3{margin:0 0 5px;font-size:13px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:6px}
.card h3 .bar{width:3px;height:12px;border-radius:2px;background:var(--teal)}
.flab{font-size:10.5px;font-weight:650;color:var(--muted);letter-spacing:.05em;margin:13px 2px 6px;display:flex;justify-content:space-between;gap:8px}
.fnote{font-size:11px;line-height:1.6;color:var(--muted);margin:6px 0 2px}.fnote b{color:var(--ink2);font-weight:650}
.flab span{font-weight:400;letter-spacing:0;color:#8B948E}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--teal-bg);color:#0B5C59;border:1px solid transparent;line-height:1.6;transition:background .12s,border-color .12s}
.chip:hover{background:#D5E8E5;border-color:#BBDCD7}
.chip.ghost{background:#F4F6F2;color:var(--ink2);font-family:inherit;font-size:11.5px}
.chip.ghost:hover{background:#EAEDE7}
.note{margin:10px 0 0;padding:9px 11px;border-radius:9px;background:var(--amber-bg);border:1px solid #EDE0C2;
  font-size:12px;line-height:1.75;color:#6B5423}
.note b{font-weight:650;color:#8A5B0F}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink2);min-width:0;word-break:break-word}
.statrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.stat{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;
  font-size:11.5px;color:var(--muted);background:#fff}
.stat b{font-size:14px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat.teal{border-color:#CFE4E1;background:#F3F9F8}
.stat.teal b{color:var(--teal-d)}
.divider{height:1px;background:var(--line);margin:14px 0 0}

/* filters */
.filters{margin:10px 0 0;border:1px solid var(--line);border-radius:11px;padding:9px;background:#FAFBF9}
.fsearch{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;background:#fff;border:1px solid var(--line2);border-radius:8px}
.fsearch:focus-within{border-color:var(--teal);box-shadow:0 0 0 2px rgba(11,110,107,.08)}
.fsearch svg{color:#8B948E;flex:0 0 14px}
.fsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:12.5px;height:30px;color:var(--ink)}
.fsearch .fx{color:#98A19B;font-size:15px;line-height:1;padding:0 2px}
.fsearch .fx:hover{color:var(--teal-d)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:6px}
.fsel{position:relative;min-width:0}
.fsel select{width:100%;height:30px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink2);
  font:inherit;font-size:11.5px;padding:0 22px 0 7px;appearance:none;outline:0;cursor:pointer;text-overflow:ellipsis}
.fsel select:focus{border-color:var(--teal)}
.fsel::after{content:"";position:absolute;right:8px;top:50%;width:5px;height:5px;border-right:1.4px solid #8B948E;
  border-bottom:1.4px solid #8B948E;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.fchip{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);
  font-size:11px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fchip:hover{border-color:var(--teal)}
.fchip.on{border-color:var(--teal);background:var(--teal);color:#fff}
.fchip .n{font-variant-numeric:tabular-nums;opacity:.72}
.fcount{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fcount b{color:var(--ink2);font-weight:650}
.fcount .sep{color:#C3CAC4;margin:0 3px}

/* paper list */
.secline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:13px 2px 7px}
.secline h3{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.secline h3 .n{font-size:11px;font-weight:400;color:var(--muted)}
.secline .sortnote{font-size:10.5px;color:var(--muted)}
.paper{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;background:#fff;
  transition:border-color .12s,box-shadow .12s}
.paper:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(27,36,33,.05)}
.paper.key{border-color:var(--gold);background:#FFFDF7}
.paper.key::after{content:"重点";position:absolute;top:9px;right:9px;font-size:9.5px;color:#8A6A12;background:#F6E9BD;
  border-radius:4px;padding:0 5px;line-height:1.6}
.paper.read{opacity:.72}
.paper.read:hover{opacity:1}
.paper .pt{margin:0 0 4px;padding-right:34px;font-size:12.8px;font-weight:650;line-height:1.5;color:var(--ink)}
.paper .pt a{color:inherit;text-decoration:none}
.paper .pt a:hover{color:var(--teal-d);text-decoration:underline}
.paper .pm,.pmeta{font-size:11px;color:var(--muted);margin:0 0 6px;line-height:1.55;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.paper .pm .sep,.pmeta .sep{color:#C3CAC4}
.pmeta .tag{margin-left:2px}
.tag.key{background:#F6E9BD;color:#8A6A12}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.tag{font-size:10.5px;line-height:1.6;padding:1px 6px;border-radius:4px;background:#EEF0EC;color:var(--ink2);white-space:nowrap}
.tag.org{color:#fff}
.tag.pol{background:#FBEDE3;color:#8A3D10}
.tag.gen{background:#EDE9F8;color:#4B3E8C}
.tag.stage{background:#EAF3F1;color:#0B5C59}
.tag.rev{background:#E7EEF6;color:#2C4A6E}
.tag.mk{background:#F2F3EF;color:#5B6661}
.paper .pz{margin:0;font-size:12px;line-height:1.72;color:var(--ink2)}
.paper .pz.miss{color:#98A19B}
.paper .acts{display:flex;align-items:center;gap:10px;margin-top:7px;padding-top:6px;border-top:1px dashed #EAEDE8;font-size:11.5px}
.paper .acts a{font-weight:600;display:inline-flex;align-items:center;gap:3px}
.paper .acts .sp{flex:1}
.actbtn{font-size:11.5px;color:var(--muted);padding:1px 4px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.actbtn:hover{background:#F0F2EE;color:var(--ink)}
.actbtn.on{color:var(--teal-d);font-weight:650}
.actbtn .dotn{width:5px;height:5px;border-radius:50%;background:var(--amber);display:inline-block}
.noteedit{margin-top:7px;padding-top:7px;border-top:1px dashed #EAEDE8;display:none}
.noteedit.on{display:block}
.noteedit textarea{width:100%;min-height:66px;resize:vertical;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;
  font:inherit;font-size:12px;line-height:1.65;color:var(--ink);background:#FCFDFB;outline:0}
.noteedit textarea:focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(11,110,107,.08)}
.noteedit .nerow{display:flex;align-items:center;gap:7px;margin-top:5px}
.noteedit .hint{font-size:10.5px;color:var(--muted);margin-left:auto}
.mini-btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:11.5px;color:var(--ink2)}
.mini-btn:hover{border-color:var(--teal);color:var(--teal-d)}
.mini-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.mini-btn.primary:hover{background:var(--teal-d);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:10px}
.tab{flex:1;padding:7px 4px 8px;border-bottom:2px solid transparent;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.tab:hover{color:var(--teal-d)}
.tab.on{border-bottom-color:var(--teal);color:var(--teal-d);font-weight:650}
.tab .n{font-size:10.5px;color:#8B948E;margin-left:2px;font-variant-numeric:tabular-nums}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty .eic{width:38px;height:38px;margin:0 auto 9px;border-radius:50%;display:grid;place-items:center;
  background:#F0F2EE;color:#98A19B}
.empty b{display:block;font-size:13px;color:var(--ink2);font-weight:650;margin-bottom:3px}
.empty p{margin:0 auto;font-size:11.5px;line-height:1.7;max-width:30em}
.empty .mono{margin-top:6px;font-size:10px;color:#98A19B;background:#F4F6F2;display:inline-block;padding:2px 7px;border-radius:5px}
.empty .mini-btn{margin-top:9px}
.readpane{padding-top:10px}
.readpane .rh{padding:2px 2px 2px}
.readpane .rh h2{margin:0 0 3px;font-size:17px;line-height:1.4}
.readpane .rh .rsub{font-size:11.5px;color:var(--muted);line-height:1.6}
.readpane article{margin-top:9px}
.readpane section{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.readpane h3{margin:0 0 5px;font-size:13px;font-weight:650;display:flex;gap:6px;align-items:center}
.readpane h3 .bar{width:3px;height:12px;border-radius:2px;background:var(--teal)}
.readpane p{margin:0;font-size:12.8px;line-height:1.9;color:var(--ink2);text-align:justify}
.datawarn{margin:12px 0;padding:11px 12px;border-radius:10px;background:#FFF4F1;border:1px solid #F3CFC7;color:#7A2E1E;font-size:12px;line-height:1.75}
.datawarn b{display:block;font-size:12.5px;margin-bottom:2px}
.datawarn .mono{font-size:10.5px;background:#fff;border:1px solid #F3CFC7;border-radius:5px;padding:2px 6px;display:inline-block;margin-top:5px}

/* backdrop + modal + toast */
.backdrop{position:fixed;inset:0;z-index:65;background:rgba(14,34,38,.34);backdrop-filter:blur(1px);display:none}
.backdrop.on{display:block}
@media (min-width:1101px){.backdrop{display:none!important}}
.modalwrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:rgba(14,34,38,.46)}
.modalbox{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--surface);border-radius:15px;
  box-shadow:0 30px 80px rgba(14,34,38,.3);padding:20px 22px 18px;position:relative}
.modalbox h2{margin:0 0 2px;font-size:17px}
.modalbox .msub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.modalbox p{font-size:12.8px;line-height:1.8;color:var(--ink2);margin:0 0 8px}
.modalbox .mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.modalbox .mstat{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#FAFBF9}
.modalbox .mstat .v{font-size:18px;font-weight:750;color:var(--teal-d);font-variant-numeric:tabular-nums;line-height:1.3}
.modalbox .mstat .k{font-size:10.5px;color:var(--muted)}
.modalbox .mclose{position:absolute;top:12px;right:12px}
.modalbox .mfoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
.modalbox ul{margin:6px 0 8px;padding-left:18px;font-size:12px;color:var(--ink2);line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:120;background:#123033;color:#EAF3F1;
  font-size:12px;padding:8px 14px;border-radius:9px;box-shadow:0 10px 30px rgba(14,34,38,.3);opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── responsive ─────────────────────────────────────────────────────── */
@media (max-width:1300px){:root{--aside-w:378px} aside.detail.wide{flex-basis:474px;width:474px} aside.detail.reading{flex-basis:520px;width:520px}}
@media (max-width:1360px){.tlgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1240px){.hd-stats{gap:11px;font-size:11.5px}}
@media (max-width:1180px){:root{--nav-w:232px}}
@media (max-width:1100px){
  .hd-detail{display:inline-flex}
  .hd-stats{display:none}
  aside.detail{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(430px,94vw);flex-basis:auto;
    box-shadow:-18px 0 60px rgba(14,34,38,.22);transform:translateX(103%);transition:transform .2s ease;border-left:1px solid var(--line)}
  aside.detail.wide,aside.detail.reading{width:min(470px,94vw)}
  aside.detail.open{transform:none}
  aside.detail.collapsed{transform:translateX(103%);width:min(430px,94vw)}
  aside.detail.collapsed .dscroll{display:block}
  aside.detail.collapsed .dhead h2,aside.detail.collapsed .dhead .dk{display:block}
  aside.detail.collapsed .railt{display:none}
  .tlgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .brand .sb{display:none}
}
@media (max-width:980px){
  :root{--nav-w:228px}
  .crumb .en{display:none}
  .searchwrap{max-width:none}
  .kbd{display:none}
  .tlgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tl .tn{font-size:11px}
}
@media (max-width:820px){
  :root{--nav-w:60px}
  nav.side{flex-basis:60px;width:60px}
  nav.side .navscroll{padding:4px 6px}
  nav.side .nitem{justify-content:center;padding:9px 0;gap:0}
  nav.side .nitem .nm,nav.side .nitem .cnt,nav.side .nitem .chev,nav.side .navsec,
  nav.side .nsub,nav.side .navfoot,nav.side .navtoggle-label{display:none!important}
  nav.side .nitem .ic{width:19px;height:19px;flex:0 0 19px}
  nav.side .nitem .dot{display:none}
  nav.side.open{width:248px;flex-basis:248px;position:fixed;left:0;top:58px;bottom:0;z-index:72;box-shadow:18px 0 50px rgba(14,34,38,.18)}
  nav.side.open .nitem{justify-content:flex-start;padding:7px 9px;gap:8px}
  nav.side.open .nitem .nm,nav.side.open .nitem .cnt,nav.side.open .navsec,nav.side.open .navfoot{display:block}
  nav.side.open .nsub{display:block}
  nav.side.open .nitem .ic{width:17px;height:17px;flex:0 0 17px}
  header.top{padding:8px 12px;gap:10px}
  .brand .nm{font-size:13.5px}
  .brand .logo{width:27px;height:27px;flex-basis:27px}
  .crumb{padding:9px 12px 6px}
  .crumb h1{font-size:16px}
  .stagewrap{padding:0 12px}
  .timeline{margin:8px 12px 12px;padding:8px 9px 9px}
  .tlgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modalbox{padding:16px 15px}
  .modalbox .mstats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .brand .sb{display:none}
  .btn{padding:0 9px}
  .crumb .path{display:none}
  .tlgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<a class="sr" href="#mainCenter">跳到解剖图区域</a>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
        <rect width="44" height="44" rx="10" fill="#0B6E6B"/>
        <path d="M6.5 23c5.5-8.6 13.2-10.3 20.4-5.6 2.3 1.5 4.1 3.7 5.2 5.6-1.1 1.9-2.9 4.1-5.2 5.6-7.2 4.7-14.9 3-20.4-5.6Z" fill="#E6F1EF"/>
        <path d="M32.5 23 39 18.2v9.6Z" fill="#E6F1EF"/>
        <path d="M13.5 20.4v5.2M18.6 18.7v8.6M23.8 19.3v7.4" stroke="#0B6E6B" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
        <circle cx="29.2" cy="21.4" r="1.35" fill="#0B6E6B"/>
      </svg>
      <div>
        <div class="nm">斑马鱼毒理图谱</div>
        <div class="sb">Danio rerio · 污染物暴露 · 跨代效应 · 衰老</div>
      </div>
    </div>

    <div class="searchwrap">
      <div class="searchbox" id="searchbox">
        <svg class="sic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="7" cy="7" r="4.7" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <label class="sr" for="gsearch">全局搜索</label>
        <input id="gsearch" type="search" autocomplete="off" spellcheck="false" aria-autocomplete="list"
               aria-controls="gresults" placeholder="搜索基因、器官、生物标志物、污染物或文献标题，例如 cyp1a">
        <span class="kbd" aria-hidden="true">⌘K</span>
      </div>
      <div class="results" id="gresults" role="listbox" aria-label="全局搜索结果"></div>
    </div>

    <div class="hd-stats" aria-label="数据统计">
      <div><span class="lbl">已收录</span> <b id="statTotal">0</b> <span class="lbl">篇</span></div>
      <div><span class="lbl">更新至</span> <b id="statUpdated">—</b></div>
    </div>
    <div class="hd-right">
      <button class="btn ghost hd-detail" id="detailToggle" type="button" aria-controls="detail" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2.5 3.5h11v9h-11z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 3.5v9" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>详情</span>
      </button>
      <button class="btn" id="aboutBtn" type="button">关于</button>
    </div>
  </header>

  <div class="body">
    <nav class="side" id="nav" aria-label="主导航">
      <div class="navtop">
        <button class="icbtn" id="navToggle" type="button" aria-controls="navScroll" aria-expanded="true" title="收起导航" aria-label="收起导航">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M9.5 3 4.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="navscroll" id="navScroll"></div>
      <div class="navfoot" id="navFoot"></div>
    </nav>

    <main class="center" id="mainCenter" tabindex="-1">
      <div class="crumb">
        <div class="t"><h1 id="title">—</h1><span class="en" id="subtitle"></span></div>
        <div class="path" id="path"></div>
      </div>

      <div class="stagewrap">
        <section class="stage" aria-label="解剖图舞台">
          <div class="stagebar">
            <div class="seg" role="group" aria-label="解剖视图切换">
              <button type="button" data-view="side" class="on" aria-pressed="true">侧视</button>
              <button type="button" data-view="cross" aria-pressed="false">横截面</button>
              <button type="button" data-view="embryo" aria-pressed="false">胚胎</button>
            </div>
            <div class="tools">
              <button class="tbtn on" id="btnLabels" type="button" aria-pressed="true"><span class="sw"></span><span>标签 开</span></button>
              <button class="tbtn" id="btnGhost" type="button" aria-pressed="false"><span class="sw"></span><span>半透明 关</span></button>
            </div>
          </div>
          <div id="anatomyHost"></div>
          <div class="hoverhint" id="hoverHint" aria-hidden="true"></div>
          <div class="stagenote" id="stageNote"></div>
        </section>
      </div>

      <section class="timeline" aria-label="生命周期时间轴">
        <div class="tlhead"><span class="tt">生命周期 · 12 阶段</span><span class="tm" id="tlMeta"></span></div>
        <div class="tlgrid" id="tlgrid"></div>
        <div class="tldesc idle" id="tldesc">点击任一阶段查看说明；解剖图会按所选阶段联动。</div>
      </section>
    </main>

    <aside class="detail" id="detail" aria-label="详情与文献列表">
      <div class="dhead">
        <div><div class="dk" id="dkind">详情</div><h2 id="dtitle">—</h2></div>
        <button class="icbtn" id="detailClose" type="button" title="收起详情" aria-label="收起详情">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 3 11.5 8l-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="railt" role="button" tabindex="0" title="展开详情栏" aria-label="展开详情栏">详情</div>
      </div>
      <div class="dscroll" id="dscroll"></div>
    </aside>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modalwrap" id="modal" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">

    <h2 id="mTitle">关于本图谱</h2>
    <div class="msub">斑马鱼（Danio rerio）生态毒理学静态图谱 · 完全离线</div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>

</noscript>

<script src="data_papers.js"></script>
