name: 斑马鱼文献每日更新

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC。UTC 22:10 = 北京时间次日 06:10。
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zebrafish-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 从 PubMed 抓取斑马鱼新文献并追加到 data_papers.js
        run: python scripts/update_zebrafish.py --days 10 --data zebrafish/data_papers.js

      - name: 校验 data_papers.js 语法
        run: node --check zebrafish/data_papers.js

      - name: 提交并推送
        run: |
          git config user.name "biblio-bot"
          git config user.email "biblio-bot@users.noreply.github.com"
          if git diff --quiet zebrafish/data_papers.js; then
            echo "没有新文献，跳过提交"
          else
            git add zebrafish/data_papers.js
            git commit -m "斑马鱼文献自动更新 $(date -u +%F)"
            git push
          fi
